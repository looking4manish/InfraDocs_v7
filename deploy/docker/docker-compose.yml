# InfraDocs — self-contained deployable stack: Mongo + API(+scanners) + Caddy web.
# Deploy on any Ubuntu/Linux host: `cp .env.example .env`, edit, `docker compose up -d`.
#
# The API runs on the HOST network + PID namespace and mounts the host read-only so
# its scanners see the real machine (proven: all 8 scanners match the host). It needs
# docker.sock + /run/systemd to manage docker & systemd on the host.
name: infradocs

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # --auth enforces access control; the root user below is created on a FRESH volume.
    # Bound to 127.0.0.1 only, but the API is host-network so every host-local process
    # can reach the port — auth is the real gate, loopback is just defense-in-depth.
    command: ["--auth", "--quiet"]
    security_opt:
      - no-new-privileges:true      # mongod never needs to gain privileges post-start
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-infradocs}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?set MONGO_PASSWORD in .env (deploy.sh generates one)}"
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"

  api:
    image: infradocs-api:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    network_mode: host          # port scanner needs host net; also reaches mongo on localhost
    pid: host                   # /proc/1/mounts (storage) + process mapping (ports)
    # NOTE: this container is intentionally privileged — it runs the host scanners and
    # fires actions via `sudo -n systemctl/nginx` + docker.sock. It therefore CANNOT take
    # no-new-privileges (breaks setuid sudo) or cap_drop (breaks the scanners). Its blast
    # radius is contained by RBAC + the per-category action allow-list + self-protect, not
    # by container caps. Keep it off the public network; expose only the `web` service.
    environment:
      INFRADOCS_MONGO_URI: "mongodb://${MONGO_USER:-infradocs}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@localhost:${MONGO_PORT:-27018}/?authSource=admin"
      INFRADOCS_API_USERNAME: "${ADMIN_USER:-admin}"
      INFRADOCS_API_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      INFRADOCS_API_PORT: "${API_PORT:-8090}"
      INFRADOCS_HOST_ROOT: "/host"
      INFRADOCS_SERVER_ID: "${SERVER_ID:-infradocs}"
      INFRADOCS_SERVER_NAME: "${SERVER_NAME:-${SERVER_ID:-infradocs}}"
      INFRADOCS_PROJECTS_ROOT: "${PROJECTS_ROOT:-/home/youruser/projects}"
      # Extra roots to hunt for scattered projects (comma-separated); read via /host.
      INFRADOCS_SCAN_ROOTS: "${SCAN_ROOTS:-}"
    volumes:
      - /:/host:ro                                  # real host disk (read-only) for storage
      - /var/run/docker.sock:/var/run/docker.sock   # docker scan + actions
      - /etc/nginx:/etc/nginx:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # read-WRITE: the scanner only reads, but teardown ('Kill Button') must back up +
      # delete project dirs and write backups to <projects_root>/backups. Read-only here made
      # teardown 500 on os.makedirs (read-only filesystem) with nothing surfaced to the UI.
      - "${PROJECTS_ROOT:-/home/msinha/projects}:${PROJECTS_ROOT:-/home/msinha/projects}:rw"
      - /etc/cron.d:/etc/cron.d:ro
      - /etc/crontab:/etc/crontab:ro
      - /etc/cron.daily:/etc/cron.daily:ro
      - /run/systemd:/run/systemd
      - /run/dbus:/run/dbus
    depends_on:
      - mongo

  web:
    image: infradocs-web:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    # Host networking so Caddy reaches the host-net API at localhost — avoids the
    # docker-bridge -> host hop that locked-down firewalls (e.g. OCI) drop. Caddy
    # listens on the port in DOMAIN (":8081" = plain HTTP on 8081; a real domain =
    # auto-TLS on 80/443). No published ports needed — host net binds directly.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE          # Caddy binds 80/443 when DOMAIN is a real hostname
    environment:
      DOMAIN: "${DOMAIN:-:8081}"
      API_UPSTREAM: "http://localhost:${API_PORT:-8090}"
    volumes:
      - caddy_data:/data       # persists Let's Encrypt certs
    depends_on:
      - api

  # --- Exposure backends — opt-in via COMPOSE_PROFILES in .env -------------
  # Cloudflare Tunnel: a public URL on ANY host (incl. behind NAT/CGNAT). Make a
  # tunnel in CF Zero Trust, route your hostname -> http://localhost:${WEB_PORT},
  # set CF_TUNNEL_TOKEN + COMPOSE_PROFILES=cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Tailscale Funnel: a public URL with NO domain (https://<host>.<tailnet>.ts.net).
  # Needs Funnel+HTTPS enabled on the tailnet and a reusable auth key as TS_AUTHKEY;
  # set COMPOSE_PROFILES=tailscale.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    restart: unless-stopped
    network_mode: host
    cap_add: ["NET_ADMIN"]
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      WEB_PORT: "${WEB_PORT:-8081}"
      TS_HOSTNAME: "${SERVER_ID:-infradocs}"
    volumes:
      - tailscale_state:/var/lib/tailscale
    command: >
      sh -c "tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state &
             sleep 3 &&
             tailscale up --authkey=\"$$TS_AUTHKEY\" --hostname=\"$$TS_HOSTNAME\" &&
             tailscale funnel --bg $$WEB_PORT &&
             wait"
    depends_on:
      - web

volumes:
  mongo_data:
  caddy_data:
  tailscale_state:
